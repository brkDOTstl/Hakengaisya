name: Suite checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run plugin:build
      - run: npm test
      - run: npm run inspect
      - run: npm run audit
      - run: npm --prefix packages/evaluator run audit
      - run: git diff --exit-code

  harness2:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install "harness2 @ git+https://github.com/google-research/harness2.git@1cfe254e8d25b15f37048c3730134686abe60335"
      - run: npm run plugin:build
      - run: npm run test:harness2
      - run: npm run example:harness2 -- --output runs/harness2-ci
      - run: git diff --exit-code
