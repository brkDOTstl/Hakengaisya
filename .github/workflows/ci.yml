name: Suite checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run plugin:build
      - run: npm test
      - run: npm run inspect
      - run: npm run audit
      - run: npm --prefix packages/evaluator run audit
      - run: git diff --exit-code
